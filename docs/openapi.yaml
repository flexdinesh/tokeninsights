          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            description:
              'Unknown capabilities are ignored by clients. Known names: usage, facets, web-dashboard,
              dashboard-reload, raw-ingestion, terminal-dashboard, collector-progress, reprocess.
              dashboard-reload is query-only and available only to local viewers.'
