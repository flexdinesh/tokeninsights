openapi: 3.0.3
info:
  title: TokenInsights REST API
  version: 2.0.0
  description:
    Read saved personal token usage, processing status and backend capture progress. Capture
    and acceptance remain private backend operations.
tags:
  - name: Instance
  - name: Sync
  - name: Usage
paths:
  /api/v2/collector-progress:
    get:
      operationId: getCollectorProgress
      summary: Read ephemeral personal collector progress
      description: 'Available only when collector-progress capability is advertised. Never starts collection. '
      tags:
        - Sync
      responses:
        '200':
          description: Recent local collector attempts, with bounded retention.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorProgressResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/v2/instance:
    get:
      operationId: getInstanceV2
      summary: Describe this TokenInsights server
      tags:
        - Instance
      responses:
        '200':
          description: Server versions, saved data hostname, capabilities, and viewer defaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponseV2'
        default:
          $ref: '#/components/responses/Error'
  /api/v2/status:
    get:
      operationId: getStatusV2
      summary: Read processing readiness and committed revision
      tags:
        - Sync
      responses:
        '200':
          description: Saved processing state; never starts collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponseV2'
        default:
          $ref: '#/components/responses/Error'
  /api/v2/usage:
    get:
      operationId: getUsage
      summary: Query canonical token usage
      description: 'Returns a sorted, paginated table, complete filtered summary, and chart

        from one validated read transaction. Date bounds use server-local dates.

        '
      tags:
        - Usage
      parameters:
        - $ref: '#/components/parameters/PeriodFilter'
        - $ref: '#/components/parameters/BucketFilter'
        - $ref: '#/components/parameters/FromFilter'
        - $ref: '#/components/parameters/ToFilter'
        - $ref: '#/components/parameters/ProviderFilter'
        - $ref: '#/components/parameters/ModelFilter'
        - $ref: '#/components/parameters/HarnessFilter'
        - $ref: '#/components/parameters/SessionFilter'
        - $ref: '#/components/parameters/RepositoryFilter'
        - $ref: '#/components/parameters/DirectoryFilter'
        - name: tab
          in: query
          description: Aggregation shown in table and chart rows.
          schema:
            allOf:
              - $ref: '#/components/schemas/UsageTab'
            default: tokens
        - name: locationGroup
          in: query
          description: Repo-tab grouping by repository or directory.
          schema:
            $ref: '#/components/schemas/LocationGroup'
        - name: sort
          in: query
          description: Sort field. Context-only fields are valid only for the context tab.
          schema:
            $ref: '#/components/schemas/SortField'
        - name: direction
          in: query
          schema:
            $ref: '#/components/schemas/SortDirection'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - $ref: '#/components/parameters/QualityFilter'
      responses:
        '200':
          description: Canonical usage result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponseV2'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /api/v2/usage/facets:
    get:
      operationId: getUsageFacets
      summary: Query available usage filters
      description: 'Each facet applies the other active filters while omitting its own.

        Session search is a case-insensitive literal substring search capped at

        100 results.

        '
      tags:
        - Usage
      parameters:
        - $ref: '#/components/parameters/PeriodFilter'
        - $ref: '#/components/parameters/BucketFilter'
        - $ref: '#/components/parameters/FromFilter'
        - $ref: '#/components/parameters/ToFilter'
        - $ref: '#/components/parameters/ProviderFilter'
        - $ref: '#/components/parameters/ModelFilter'
        - $ref: '#/components/parameters/HarnessFilter'
        - $ref: '#/components/parameters/SessionFilter'
        - $ref: '#/components/parameters/RepositoryFilter'
        - $ref: '#/components/parameters/DirectoryFilter'
        - name: search
          in: query
          description: Literal substring used to filter session IDs.
          schema:
            type: string
            default: ''
        - name: tab
          in: query
          description: Active aggregation. Repository/directory filters require the repo tab.
          schema:
            allOf:
              - $ref: '#/components/schemas/UsageTab'
            default: tokens
        - $ref: '#/components/parameters/QualityFilter'
      responses:
        '200':
          description: Available dimension values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageFacetsResponseV2'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    PeriodFilter:
      name: period
      in: query
      schema:
        allOf:
          - $ref: '#/components/schemas/Period'
        default: month
    BucketFilter:
      name: bucket
      in: query
      schema:
        allOf:
          - $ref: '#/components/schemas/Bucket'
        default: day
    FromFilter:
      name: from
      in: query
      description: Inclusive lower local-date bound; replaces period when supplied.
      schema:
        type: string
        format: date
        x-go-type: string
    ToFilter:
      name: to
      in: query
      description: Inclusive upper local-date bound; replaces period when supplied.
      schema:
        type: string
        format: date
        x-go-type: string
    ProviderFilter:
      name: provider
      in: query
      description: Provider filter. Repeat the parameter to select multiple values.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    ModelFilter:
      name: model
      in: query
      description: Model filter. Repeat the parameter to select multiple values.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    HarnessFilter:
      name: harness
      in: query
      description: Harness filter. Repeat the parameter to select multiple values.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Harness'
    SessionFilter:
      name: session
      in: query
      description: Session-ID filter. Repeat the parameter to select multiple values.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    RepositoryFilter:
      name: repository
      in: query
      description:
        Repo-tab stable repository key; repeat for multiple values. The key unknown selects
        missing values.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    DirectoryFilter:
      name: directory
      in: query
      description:
        Repo-tab stable directory key; repeat for multiple values. The key unknown selects
        missing values.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    QualityFilter:
      name: quality
      in: query
      schema:
        allOf:
          - $ref: '#/components/schemas/UsageQuality'
        default: confirmed
  responses:
    InvalidRequest:
      description: Invalid query parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: invalid_request
            message: Invalid period.
    Unavailable:
      description: Canonical usage cannot currently be read
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: unavailable
            message: Saved usage is currently unavailable.
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Period:
      type: string
      enum:
        - today
        - yesterday
        - week
        - month
        - year
        - all
    Bucket:
      type: string
      enum:
        - day
        - week
        - month
        - year
    Harness:
      type: string
      enum:
        - opencode
        - pi
        - codex
        - claude-code
    UsageTab:
      type: string
      enum:
        - tokens
        - models
        - providers
        - harnesses
        - sessions
        - context
        - repo
    LocationGroup:
      type: string
      enum:
        - repository
        - directory
    SortField:
      type: string
      enum:
        - name
        - date
        - total
        - input
        - output
        - reasoning
        - cacheRead
        - cacheWrite
        - sessions
        - context
        - averageContext
        - medianContext
        - maxContext
        - harness
        - provider
        - model
    SortDirection:
      type: string
      enum:
        - asc
        - desc
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - not_found
        - method_not_allowed
        - unavailable
        - internal_error
    Selection:
      type: object
      additionalProperties: false
      required:
        - period
        - bucket
        - from
        - to
        - providers
        - models
        - harnesses
        - sessions
      properties:
        period:
          $ref: '#/components/schemas/Period'
        bucket:
          $ref: '#/components/schemas/Bucket'
        from:
          description: Inclusive lower local-date bound, or empty when unset.
          type: string
        to:
          description: Inclusive upper local-date bound, or empty when unset.
          type: string
        providers:
          type: array
          items:
            type: string
        models:
          type: array
          items:
            type: string
        harnesses:
          type: array
          items:
            $ref: '#/components/schemas/Harness'
        sessions:
          type: array
          items:
            type: string
    Count:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
    TimestampMs:
      type: integer
      format: int64
      minimum: 0
      maximum: 253402214399999
      description:
        Unix milliseconds through 9999-12-30T23:59:59.999Z. One day of headroom preserves calendar
        query support after timezone conversion. Source units are never guessed or rescaled.
    UsageRow:
      type: object
      additionalProperties: false
      required:
        - key
        - name
        - harness
        - provider
        - model
        - date
        - sessions
        - input
        - output
        - reasoning
        - cacheRead
        - cacheWrite
        - total
        - context
        - averageContext
        - medianContext
        - maxContext
        - locationKey
        - locationName
        - directoryNames
        - hasUnknownDirectory
        - repositoryKey
        - repositoryName
      properties:
        key:
          type: string
        name:
          type: string
        harness:
          type: string
        provider:
          type: string
        model:
          type: string
        date:
          $ref: '#/components/schemas/Count'
        sessions:
          $ref: '#/components/schemas/Count'
        input:
          $ref: '#/components/schemas/Count'
        output:
          $ref: '#/components/schemas/Count'
        reasoning:
          $ref: '#/components/schemas/Count'
        cacheRead:
          $ref: '#/components/schemas/Count'
        cacheWrite:
          $ref: '#/components/schemas/Count'
        total:
          $ref: '#/components/schemas/Count'
        context:
          $ref: '#/components/schemas/Count'
        averageContext:
          $ref: '#/components/schemas/Count'
        medianContext:
          $ref: '#/components/schemas/Count'
        maxContext:
          $ref: '#/components/schemas/Count'
        locationKey:
          type: string
        locationName:
          type: string
          description: Sanitized display label; full source paths are never ingested.
        directoryNames:
          type: array
          items:
            type: string
          description:
            Distinct recorded directories contributing to this row, sorted by display name.
            Empty outside Repo rows.
        hasUnknownDirectory:
          type: boolean
          description: Whether any contributing fact lacks a recorded directory. False outside Repo rows.
        repositoryKey:
          type: string
        repositoryName:
          type: string
    UsageSummary:
      type: object
      additionalProperties: false
      required:
        - total
        - input
        - output
        - reasoning
        - cacheRead
        - cacheWrite
        - sessions
        - syncedSessions
      properties:
        total:
          $ref: '#/components/schemas/Count'
        input:
          $ref: '#/components/schemas/Count'
        output:
          $ref: '#/components/schemas/Count'
        reasoning:
          $ref: '#/components/schemas/Count'
        cacheRead:
          $ref: '#/components/schemas/Count'
        cacheWrite:
          $ref: '#/components/schemas/Count'
        sessions:
          $ref: '#/components/schemas/Count'
        syncedSessions:
          $ref: '#/components/schemas/Count'
    LocationOption:
      type: object
      additionalProperties: false
      required:
        - key
        - name
      properties:
        key:
          type: string
        name:
          type: string
          description: Sanitized display label; full source paths are never ingested.
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          minLength: 1
    UsageQuality:
      type: string
      enum:
        - confirmed
        - estimated
      description: Estimated evidence is queried separately and never included in confirmed totals.
    InstanceResponseV2:
      type: object
      additionalProperties: false
      required:
        - instanceId
        - dataEpoch
        - dataReadiness
        - apiVersion
        - serverVersion
        - hostname
        - timezone
        - capabilities
        - defaults
        - datasetId
        - serverKind
        - permissions
      properties:
        instanceId:
          type: string
          minLength: 1
        dataEpoch:
          type: string
          description: Durable database identity; nonempty when dataReadiness is ready.
        dataReadiness:
          type: string
          enum:
            - ready
            - metadata
            - recovery
            - rebuild
            - unavailable
        apiVersion:
          type: string
          enum:
            - v2
        serverVersion:
          type: string
          minLength: 1
        hostname:
          description: Verified personal backend hostname, available without capture.
          type: string
          minLength: 1
        timezone:
          type: string
          minLength: 1
          description:
            Server reporting timezone, preferably an IANA name with historical DST rules. Unnamed
            system zones use an explicit UTC offset fallback.
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            description:
              'Unknown capabilities are ignored. Known names: usage, facets, web-dashboard,
              dashboard-reload, terminal-dashboard, collector-progress. Reload queries saved data only.'
        defaults:
          $ref: '#/components/schemas/Selection'
        datasetId:
          type: string
          minLength: 1
          maxLength: 256
        serverKind:
          type: string
          enum:
            - personal
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - read
    StatusResponseV2:
      type: object
      additionalProperties: false
      required:
        - instanceId
        - dataEpoch
        - dataReadiness
        - revision
        - datasetId
        - generation
        - targetGeneration
        - inputRevision
        - pending
      properties:
        instanceId:
          type: string
          minLength: 1
        dataEpoch:
          type: string
          description: Durable database identity; nonempty when dataReadiness is ready.
        dataReadiness:
          type: string
          enum:
            - ready
            - metadata
            - recovery
            - rebuild
            - unavailable
        revision:
          $ref: '#/components/schemas/Count'
        generation:
          $ref: '#/components/schemas/Count'
        inputRevision:
          $ref: '#/components/schemas/Count'
        pending:
          $ref: '#/components/schemas/Count'
        datasetId:
          type: string
          minLength: 1
          maxLength: 256
        targetGeneration:
          $ref: '#/components/schemas/Count'
        failed:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Pending scopes with a durable processing error in this dataset and target generation.
        failedRetryAtMs:
          type: integer
          format: int64
          minimum: 0
          maximum: 253402214399999
          description:
            Earliest retry time for failed pending scopes, as Unix milliseconds; zero when
            none exist.
        processUsage:
          $ref: '#/components/schemas/ProcessUsage'
    ProcessUsage:
      type: object
      additionalProperties: false
      description: Current personal backend process resources. Unavailable measurements are omitted.
      properties:
        cpuPercent:
          type: number
          format: double
          minimum: 0
          description:
            Process user plus system CPU time over the sampling interval; 100 percent is one
            fully utilized core. Absent until a sampling interval is available.
        residentMemoryBytes:
          $ref: '#/components/schemas/Count'
    UsageResponseV2:
      type: object
      additionalProperties: false
      required:
        - instanceId
        - dataEpoch
        - revision
        - rows
        - chart
        - rowCount
        - page
        - pageSize
        - summary
        - lastSynced
        - range
        - datasetId
      properties:
        factCount:
          $ref: '#/components/schemas/Count'
        instanceId:
          type: string
          minLength: 1
        dataEpoch:
          type: string
          minLength: 1
        revision:
          $ref: '#/components/schemas/Count'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/UsageRow'
        chart:
          type: array
          items:
            $ref: '#/components/schemas/UsageRow'
        rowCount:
          $ref: '#/components/schemas/Count'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        summary:
          $ref: '#/components/schemas/UsageSummary'
        lastSynced:
          description: Time of the last committed ingestion, in Unix milliseconds; zero for an empty server.
          allOf:
            - $ref: '#/components/schemas/Count'
        range:
          type: string
        generation:
          $ref: '#/components/schemas/Count'
        inputRevision:
          $ref: '#/components/schemas/Count'
        pending:
          $ref: '#/components/schemas/Count'
        unresolved:
          $ref: '#/components/schemas/Count'
        quality:
          $ref: '#/components/schemas/UsageQuality'
        datasetId:
          type: string
          minLength: 1
          maxLength: 256
    UsageFacetsResponseV2:
      type: object
      additionalProperties: false
      required:
        - instanceId
        - dataEpoch
        - revision
        - providers
        - models
        - harnesses
        - sessions
        - repositories
        - directories
        - datasetId
      properties:
        instanceId:
          type: string
          minLength: 1
        dataEpoch:
          type: string
          minLength: 1
        revision:
          $ref: '#/components/schemas/Count'
        providers:
          type: array
          items:
            type: string
        models:
          type: array
          items:
            type: string
        harnesses:
          type: array
          items:
            $ref: '#/components/schemas/Harness'
        sessions:
          type: array
          items:
            type: string
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/LocationOption'
        directories:
          type: array
          items:
            $ref: '#/components/schemas/LocationOption'
        generation:
          $ref: '#/components/schemas/Count'
        inputRevision:
          $ref: '#/components/schemas/Count'
        pending:
          $ref: '#/components/schemas/Count'
        datasetId:
          type: string
          minLength: 1
          maxLength: 256
    CollectorAttempt:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - stage
        - harnesses
        - acknowledgedBatches
        - acknowledgedEntries
        - pendingKnown
        - pending
        - startedAtMs
        - updatedAtMs
        - expiresAtMs
      properties:
        attemptId:
          type: string
          minLength: 1
        stage:
          type: string
          enum:
            - waiting
            - capturing
            - submitting
            - accepted
            - failed
            - interrupted
        harnesses:
          type: object
          additionalProperties:
            type: string
            enum:
              - waiting
              - running
              - complete
              - failed
              - skipped
        acknowledgedBatches: &id001
          $ref: '#/components/schemas/Count'
        acknowledgedEntries: *id001
        pendingKnown:
          type: boolean
        pending: *id001
        errorCode:
          type: string
          enum:
            - collection_failed
            - submission_failed
            - cancelled
            - publisher_lost
        startedAtMs: &id002
          $ref: '#/components/schemas/TimestampMs'
        updatedAtMs: *id002
        expiresAtMs: *id002
        finishedAtMs: *id002
    CollectorProgressResponse:
      type: object
      additionalProperties: false
      required:
        - instanceId
        - attempts
      properties:
        instanceId:
          type: string
          minLength: 1
        attempts:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/CollectorAttempt'
