openapi: 3.0.3
info:
  title: TokenInsights REST API
  version: 2.0.0
  description:
    Query dataset-scoped usage and ingest sanitized collector evidence. Personal servers are
    unauthenticated; hosted servers authenticate bearer tokens or read-only browser sessions.
    Servers interpret evidence and never scan host artifacts.
tags:
  - name: Instance
  - name: Sync
  - name: Usage
  - name: Ingestion
paths:
  /api/v2/collector-progress:
    get:
      security:
        - bearerAuth: []
        - browserSession: []
        - {}
      operationId: getCollectorProgress
      summary: Read ephemeral personal collector progress
      description:
        Available only when collector-progress capability is advertised. Never starts collection.
        Hosted servers do not expose this route.
      tags:
        - Sync
      responses:
        '200':
          description: Recent local collector attempts, with bounded retention.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorProgressResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/v2/instance:
    get:
      security:
        - bearerAuth: []
        - browserSession: []
        - {}
      operationId: getInstanceV2
      summary: Describe this TokenInsights server
      tags:
        - Instance
      responses:
        '200':
          description: Server versions, saved data hostname, capabilities, and viewer defaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponseV2'
        default:
          $ref: '#/components/responses/Error'
  /api/v2/status:
    get:
      security:
        - bearerAuth: []
        - browserSession: []
        - {}
      operationId: getStatusV2
      summary: Read processing readiness and committed revision
      tags:
        - Sync
      responses:
        '200':
          description: Saved processing state; never starts collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponseV2'
        default:
          $ref: '#/components/responses/Error'
  /api/v2/usage:
    get:
      security:
        - bearerAuth: []
        - browserSession: []
        - {}
      operationId: getUsage
      summary: Query canonical token usage
      description: 'Returns a sorted, paginated table, complete filtered summary, and chart

        from one validated read transaction. Date bounds use server-local dates.

        '
      tags:
        - Usage
      parameters:
        - $ref: '#/components/parameters/PeriodFilter'
        - $ref: '#/components/parameters/BucketFilter'
        - $ref: '#/components/parameters/FromFilter'
        - $ref: '#/components/parameters/ToFilter'
        - $ref: '#/components/parameters/ProviderFilter'
        - $ref: '#/components/parameters/ModelFilter'
        - $ref: '#/components/parameters/HarnessFilter'
        - $ref: '#/components/parameters/SessionFilter'
        - $ref: '#/components/parameters/RepositoryFilter'
        - $ref: '#/components/parameters/DirectoryFilter'
        - name: tab
          in: query
          description: Aggregation shown in table and chart rows.
          schema:
            allOf:
              - $ref: '#/components/schemas/UsageTab'
            default: tokens
        - name: locationGroup
          in: query
          description: Repo-tab grouping by repository or directory.
          schema:
            $ref: '#/components/schemas/LocationGroup'
        - name: sort
          in: query
          description: Sort field. Context-only fields are valid only for the context tab.
          schema:
            $ref: '#/components/schemas/SortField'
        - name: direction
          in: query
          schema:
            $ref: '#/components/schemas/SortDirection'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - $ref: '#/components/parameters/QualityFilter'
      responses:
        '200':
          description: Canonical usage result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponseV2'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /api/v2/usage/facets:
    get:
      security:
        - bearerAuth: []
        - browserSession: []
        - {}
      operationId: getUsageFacets
      summary: Query available usage filters
      description: 'Each facet applies the other active filters while omitting its own.

        Session search is a case-insensitive literal substring search capped at

        100 results.

        '
      tags:
        - Usage
      parameters:
        - $ref: '#/components/parameters/PeriodFilter'
        - $ref: '#/components/parameters/BucketFilter'
        - $ref: '#/components/parameters/FromFilter'
        - $ref: '#/components/parameters/ToFilter'
        - $ref: '#/components/parameters/ProviderFilter'
        - $ref: '#/components/parameters/ModelFilter'
        - $ref: '#/components/parameters/HarnessFilter'
        - $ref: '#/components/parameters/SessionFilter'
        - $ref: '#/components/parameters/RepositoryFilter'
        - $ref: '#/components/parameters/DirectoryFilter'
        - name: search
          in: query
          description: Literal substring used to filter session IDs.
          schema:
            type: string
            default: ''
        - name: tab
          in: query
          description: Active aggregation. Repository/directory filters require the repo tab.
          schema:
            allOf:
              - $ref: '#/components/schemas/UsageTab'
            default: tokens
        - $ref: '#/components/parameters/QualityFilter'
      responses:
        '200':
          description: Available dimension values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageFacetsResponseV2'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Error'
  /api/v3/ingestion/capabilities:
    get:
      security:
        - bearerAuth: []
        - {}
      operationId: getRawIngestionCapabilitiesV3
      summary: Read raw ingestion contract and durable database identity
      tags:
        - Ingestion
      responses:
        '200':
          description: Acceptance-only ingestion contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawCapabilitiesV3'
        '503':
          description: Storage unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionError'
        '401':
          description: Hosted authentication required; no acceptance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionError'
        '403':
          description: Hosted ingestion permission required; browser sessions are read-only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionError'
        '429':
          description: Admission limit reached; retry exact bytes after backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionError'
      description:
        Describes durable acceptance limits and the effective server-owned dataset. Hosted requests
        require an ingest-scoped bearer token. Personal managed ingestion uses private Unix transport.
  /api/v3/ingestion/batches:
    post:
      security:
        - bearerAuth: []
        - {}
      operationId: ingestRawBatchV3
      summary: Durably accept immutable sanitized source evidence
      description:
        Raw evidence, submitted item mappings, immutable receipt and pending work commit together.
        Duplicate evidence succeeds without double counting. Processing runs asynchronously. Database and
        authenticated dataset binding are verified before acceptance. Hosted ingestion requires an ingest-scoped
        bearer token. Managed personal HTTP is query-only; ingestion uses private Unix transport. Metadata
        strings are limited to 256 UTF-8 bytes.
      tags:
        - Ingestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RawBatchV3'
      responses:
        '200':
          description:
            Durably accepted; all items terminal for current processing generation and scope
            revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawAcceptanceV3'
        '202':
          description: Durably accepted; processing remains asynchronous.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawAcceptanceV3'
        '400':
          description: Invalid JSON or private/unknown fields; no acceptance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionError'
        '409':
          description: Batch bytes, sequence binding or database identity conflict; no acceptance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionError'
        '413':
          description: Body exceeds 1 MiB; no acceptance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionError'
        '422':
          description: Unsupported contract; no acceptance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionError'
        '503':
          description: Cannot durably accept; retry exact bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionError'
        '401':
          description: Hosted authentication required; no acceptance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionError'
        '403':
          description: Hosted ingestion permission required; browser sessions are read-only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionError'
        '429':
          description: Admission limit reached; retry exact bytes after backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionError'
  /api/v3/ingestion/batches/{stream}/{batch}:
    get:
      security:
        - bearerAuth: []
        - {}
      operationId: getRawBatchStatusV3
      summary: Read immutable acceptance and current per-item processing status
      tags:
        - Ingestion
      parameters:
        - name: stream
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: batch
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        '200':
          description:
            Durably accepted; all items terminal for current processing generation and scope
            revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawAcceptanceV3'
        '202':
          description: Durably accepted; processing remains asynchronous.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawAcceptanceV3'
        '503':
          description: Cannot durably accept; retry exact bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionError'
        '404':
          description: No accepted batch with this identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionError'
        '401':
          description: Hosted authentication required; no acceptance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionError'
        '403':
          description: Hosted ingestion permission required; browser sessions are read-only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionError'
        '429':
          description: Admission limit reached; retry exact bytes after backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionError'
  /api/v2/auth/session:
    post:
      operationId: createBrowserSession
      summary: Exchange bearer token for a read-only browser cookie
      description: Hosted-only, canonical same-origin exchange. Sets a host-only Secure HttpOnly SameSite=Lax cookie for 24 hours. The bearer token is never returned or persisted by the browser.
      tags:
        - Instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserSessionRequest'
      responses:
        '204':
          description: Authenticated browser session established.
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteBrowserSession
      summary: End this browser session
      tags:
        - Instance
      responses:
        '204':
          description: Browser session cleared.
        default:
          $ref: '#/components/responses/Error'
  /api/v2/processing/reprocess:
    post:
      operationId: reprocessEvidence
      summary: Stage reprocessing of retained raw evidence
      description:
        Builds a new generation asynchronously. Published history stays active until replacement
        coverage is complete. Available on private local transport and the remote server.
      tags:
        - Ingestion
      responses:
        '202':
          description: Durable reprocessing generation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReprocessAcceptance'
        '503':
          description: Unable to queue reprocessing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Hosted token; effective dataset and read/ingest scopes resolved by
        the server.
    browserSession:
      type: apiKey
      in: cookie
      name: tokeninsights_session
      description: Read-only, HttpOnly browser session established by POST /api/v2/auth/session.
  parameters:
    PeriodFilter:
      name: period
      in: query
      schema:
        allOf:
          - $ref: '#/components/schemas/Period'
        default: month
    BucketFilter:
      name: bucket
      in: query
      schema:
        allOf:
          - $ref: '#/components/schemas/Bucket'
        default: day
    FromFilter:
      name: from
      in: query
      description: Inclusive lower local-date bound; replaces period when supplied.
      schema:
        type: string
        format: date
        x-go-type: string
    ToFilter:
      name: to
      in: query
      description: Inclusive upper local-date bound; replaces period when supplied.
      schema:
        type: string
        format: date
        x-go-type: string
    ProviderFilter:
      name: provider
      in: query
      description: Provider filter. Repeat the parameter to select multiple values.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    ModelFilter:
      name: model
      in: query
      description: Model filter. Repeat the parameter to select multiple values.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    HarnessFilter:
      name: harness
      in: query
      description: Harness filter. Repeat the parameter to select multiple values.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Harness'
    SessionFilter:
      name: session
      in: query
      description: Session-ID filter. Repeat the parameter to select multiple values.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    RepositoryFilter:
      name: repository
      in: query
      description:
        Repo-tab stable repository key; repeat for multiple values. The key unknown selects
        missing values.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    DirectoryFilter:
      name: directory
      in: query
      description:
        Repo-tab stable directory key; repeat for multiple values. The key unknown selects
        missing values.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    QualityFilter:
      name: quality
      in: query
      schema:
        allOf:
          - $ref: '#/components/schemas/UsageQuality'
        default: confirmed
  responses:
    InvalidRequest:
      description: Invalid query parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: invalid_request
            message: Invalid period.
    Unavailable:
      description: Canonical usage cannot currently be read
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: unavailable
            message: Saved usage is currently unavailable.
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Period:
      type: string
      enum:
        - today
        - yesterday
        - week
        - month
        - year
        - all
    Bucket:
      type: string
      enum:
        - day
        - week
        - month
        - year
    Harness:
      type: string
      enum:
        - opencode
        - pi
        - codex
        - claude-code
    UsageTab:
      type: string
      enum:
        - tokens
        - models
        - providers
        - harnesses
        - sessions
        - context
        - repo
    LocationGroup:
      type: string
      enum:
        - repository
        - directory
    SortField:
      type: string
      enum:
        - name
        - date
        - total
        - input
        - output
        - reasoning
        - cacheRead
        - cacheWrite
        - sessions
        - context
        - averageContext
        - medianContext
        - maxContext
        - harness
        - provider
        - model
    SortDirection:
      type: string
      enum:
        - asc
        - desc
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - not_found
        - method_not_allowed
        - unavailable
        - internal_error
    Selection:
      type: object
      additionalProperties: false
      required:
        - period
        - bucket
        - from
        - to
        - providers
        - models
        - harnesses
        - sessions
      properties:
        period:
          $ref: '#/components/schemas/Period'
        bucket:
          $ref: '#/components/schemas/Bucket'
        from:
          description: Inclusive lower local-date bound, or empty when unset.
          type: string
        to:
          description: Inclusive upper local-date bound, or empty when unset.
          type: string
        providers:
          type: array
          items:
            type: string
        models:
          type: array
          items:
            type: string
        harnesses:
          type: array
          items:
            $ref: '#/components/schemas/Harness'
        sessions:
          type: array
          items:
            type: string
    Count:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
    TimestampMs:
      type: integer
      format: int64
      minimum: 0
      maximum: 253402214399999
      description:
        Unix milliseconds through 9999-12-30T23:59:59.999Z. One day of headroom preserves calendar
        query support after timezone conversion. Source units are never guessed or rescaled.
    UsageRow:
      type: object
      additionalProperties: false
      required:
        - key
        - name
        - harness
        - provider
        - model
        - date
        - sessions
        - input
        - output
        - reasoning
        - cacheRead
        - cacheWrite
        - total
        - context
        - averageContext
        - medianContext
        - maxContext
        - locationKey
        - locationName
        - directoryNames
        - hasUnknownDirectory
        - repositoryKey
        - repositoryName
      properties:
        key:
          type: string
        name:
          type: string
        harness:
          type: string
        provider:
          type: string
        model:
          type: string
        date:
          $ref: '#/components/schemas/Count'
        sessions:
          $ref: '#/components/schemas/Count'
        input:
          $ref: '#/components/schemas/Count'
        output:
          $ref: '#/components/schemas/Count'
        reasoning:
          $ref: '#/components/schemas/Count'
        cacheRead:
          $ref: '#/components/schemas/Count'
        cacheWrite:
          $ref: '#/components/schemas/Count'
        total:
          $ref: '#/components/schemas/Count'
        context:
          $ref: '#/components/schemas/Count'
        averageContext:
          $ref: '#/components/schemas/Count'
        medianContext:
          $ref: '#/components/schemas/Count'
        maxContext:
          $ref: '#/components/schemas/Count'
        locationKey:
          type: string
        locationName:
          type: string
          description: Sanitized display label; full source paths are never ingested.
        directoryNames:
          type: array
          items:
            type: string
          description:
            Distinct recorded directories contributing to this row, sorted by display name.
            Empty outside Repo rows.
        hasUnknownDirectory:
          type: boolean
          description: Whether any contributing fact lacks a recorded directory. False outside Repo rows.
        repositoryKey:
          type: string
        repositoryName:
          type: string
    UsageSummary:
      type: object
      additionalProperties: false
      required:
        - total
        - input
        - output
        - reasoning
        - cacheRead
        - cacheWrite
        - sessions
        - syncedSessions
      properties:
        total:
          $ref: '#/components/schemas/Count'
        input:
          $ref: '#/components/schemas/Count'
        output:
          $ref: '#/components/schemas/Count'
        reasoning:
          $ref: '#/components/schemas/Count'
        cacheRead:
          $ref: '#/components/schemas/Count'
        cacheWrite:
          $ref: '#/components/schemas/Count'
        sessions:
          $ref: '#/components/schemas/Count'
        syncedSessions:
          $ref: '#/components/schemas/Count'
    LocationOption:
      type: object
      additionalProperties: false
      required:
        - key
        - name
      properties:
        key:
          type: string
        name:
          type: string
          description: Sanitized display label; full source paths are never ingested.
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          minLength: 1
    IngestionError:
      type: object
      additionalProperties: false
      required:
        - code
        - stage
      properties:
        code:
          type: string
          maxLength: 256
          description: At most 256 UTF-8 bytes; no control characters.
          minLength: 1
        stage:
          type: string
          maxLength: 256
          description: At most 256 UTF-8 bytes; no control characters.
          minLength: 1
        batchId:
          type: string
          maxLength: 256
          description: At most 256 UTF-8 bytes; no control characters.
          minLength: 1
        factId:
          type: string
          maxLength: 256
          description: At most 256 UTF-8 bytes; no control characters.
          minLength: 1
      description: Safe diagnostic codes and correlation IDs; request content is never echoed.
    UsageQuality:
      type: string
      enum:
        - confirmed
        - estimated
      description: Estimated evidence is queried separately and never included in confirmed totals.
    NativeScalar:
      anyOf:
        - type: string
          nullable: true
        - type: number
        - type: boolean
      description:
        Original scalar source value, including explicit null. Processing validates integer
        counters and native timestamps.
    RawSourceData:
      type: object
      additionalProperties: false
      properties:
        type:
          $ref: '#/components/schemas/NativeScalar'
        id:
          $ref: '#/components/schemas/NativeScalar'
        timestamp:
          $ref: '#/components/schemas/NativeScalar'
        uuid:
          $ref: '#/components/schemas/NativeScalar'
        sessionId:
          $ref: '#/components/schemas/NativeScalar'
        session_id:
          $ref: '#/components/schemas/NativeScalar'
          x-go-name: SessionIdAlias
        requestId:
          $ref: '#/components/schemas/NativeScalar'
        request_id:
          $ref: '#/components/schemas/NativeScalar'
          x-go-name: RequestIdAlias
        time_created:
          $ref: '#/components/schemas/NativeScalar'
          x-go-name: TimeCreatedAlias
        project_id:
          $ref: '#/components/schemas/NativeScalar'
          x-go-name: ProjectIdAlias
        vcs:
          $ref: '#/components/schemas/NativeScalar'
        message:
          type: object
          additionalProperties: false
          properties:
            role:
              $ref: '#/components/schemas/NativeScalar'
            timestamp:
              $ref: '#/components/schemas/NativeScalar'
            id:
              $ref: '#/components/schemas/NativeScalar'
            provider:
              $ref: '#/components/schemas/NativeScalar'
            provider_id:
              $ref: '#/components/schemas/NativeScalar'
              x-go-name: ProviderIdAlias
            providerID:
              $ref: '#/components/schemas/NativeScalar'
            model:
              $ref: '#/components/schemas/NativeScalar'
            model_id:
              $ref: '#/components/schemas/NativeScalar'
              x-go-name: ModelIdAlias
            modelID:
              $ref: '#/components/schemas/NativeScalar'
            usage:
              type: object
              additionalProperties: false
              properties:
                input:
                  $ref: '#/components/schemas/NativeScalar'
                output:
                  $ref: '#/components/schemas/NativeScalar'
                reasoning:
                  $ref: '#/components/schemas/NativeScalar'
                cacheRead:
                  $ref: '#/components/schemas/NativeScalar'
                cacheWrite:
                  $ref: '#/components/schemas/NativeScalar'
                totalTokens:
                  $ref: '#/components/schemas/NativeScalar'
                input_tokens:
                  $ref: '#/components/schemas/NativeScalar'
                  x-go-name: InputTokensAlias
                output_tokens:
                  $ref: '#/components/schemas/NativeScalar'
                  x-go-name: OutputTokensAlias
                cache_read_input_tokens:
                  $ref: '#/components/schemas/NativeScalar'
                  x-go-name: CacheReadInputTokensAlias
                cache_creation_input_tokens:
                  $ref: '#/components/schemas/NativeScalar'
                  x-go-name: CacheCreationInputTokensAlias
                total_tokens:
                  $ref: '#/components/schemas/NativeScalar'
                  x-go-name: TotalTokensAlias
                output_tokens_details:
                  type: object
                  additionalProperties: false
                  properties:
                    thinking_tokens:
