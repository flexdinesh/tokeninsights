packages:
  - 'packages/cli'
  - 'packages/web'
  - 'packages/plugin-pi'
  - 'packages/plugin-opencode'
  - 'packages/plugin-runtime'
  - 'tools/build'
  - 'docs-website'
injectWorkspacePackages: true
allowBuilds:
  '@google/genai': true
  es5-ext: false
  esbuild: true
  koffi: true
  msgpackr-extract: true
  msw: true
  protobufjs: true
  vue-demi: false
# Supply-chain policy applied everywhere (local, CI, Docker): packages must be
# 3 days old, except harness SDKs tracked as soon as they ship.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@opencode/*'
  - '@earendil-works/*'
