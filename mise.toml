min_version = "2026.10.18"

[settings]
# Required by [deps]. Exact pins below resolve once into the committed mise.lock.
experimental = true
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64"]

# Locked installs for this project only; global user tools stay unaffected.
[tool_config]
locked = true

[settings.task]
output = "keep-order"
source_freshness_hash_contents = true

# check:toolchain keeps these pins equal to the Dockerfile, packageManager and go.mod toolchain.
[tools]
"aqua:dagger/dagger" = "0.21.11"
go = "1.27.3"
node = "26.12.1"
pnpm = "12.15.0"

[env]
# Never let go switch to another toolchain behind the pinned one.
GOTOOLCHAIN = "local"
_.path = ["{{config_root}}/node_modules/.bin"]

[deps.pnpm]
auto = false
run = "pnpm install --frozen-lockfile"

[vars]
format_paths = "package.json compose.yaml pnpm-workspace.yaml orval.config.ts .agents/plugins .claude-plugin deploy docs/openapi.yaml docs-website .github/workflows packages/cli/package.json packages/web packages/plugin-codex packages/plugin-claude packages/plugin-pi packages/plugin-opencode packages/plugin-runtime tools/build"
lint_paths = "orval.config.ts docs-website packages/web packages/plugin-pi packages/plugin-opencode packages/plugin-runtime tools/build"

# Setup

[tasks.setup]
description = "Install dependencies and local Git hooks"
run = "mise deps install"

[tasks."setup:browser"]
depends = ["validation:build:deps"]
description = "Install Chromium for local browser tests"
run = "pnpm --filter @tokeninsights/web exec playwright install chromium"

# Format and lint

[tasks.format]
depends = ["validation:build:deps"]
description = "Format Go, TypeScript, config and mise files"
run = [
  "node tools/build/src/format-go.ts",
  "oxfmt {{vars.format_paths}}",
  "mise fmt",
]

[tasks."format:check"]
description = "Isolated contracts validation"
dir = "{{config_root}}/tools/validation"
run = "go run ./cmd/validate --group contracts"

[tasks."lint"]
description = "Isolated javascript, go validation"
dir = "{{config_root}}/tools/validation"
run = "go run ./cmd/validate --group javascript --group go"

[tasks."check-schema"]
description = "Isolated contracts validation"
dir = "{{config_root}}/tools/validation"
run = "go run ./cmd/validate --group contracts"

[tasks."check-api"]
description = "Isolated contracts validation"
dir = "{{config_root}}/tools/validation"
run = "go run ./cmd/validate --group contracts"

[tasks."check:toolchain"]
description = "Isolated contracts validation"
dir = "{{config_root}}/tools/validation"
run = "go run ./cmd/validate --group contracts"

[tasks."check:plugins"]
description = "Isolated javascript validation"
dir = "{{config_root}}/tools/validation"
run = "go run ./cmd/validate --group javascript"

[tasks."typecheck:plugins"]
description = "Isolated javascript validation"
dir = "{{config_root}}/tools/validation"
run = "go run ./cmd/validate --group javascript"

[tasks."generate:api:go"]
description = "Regenerate Go API server code"
dir = "{{config_root}}/packages/cli"
run = "go tool oapi-codegen -config internal/server/api/oapi-codegen.yaml ../../docs/openapi.yaml"

[tasks."generate:api:web"]
depends = ["validation:build:deps"]
description = "Regenerate web API client"
run = [
  "orval --config orval.config.ts",
  "oxfmt packages/web/src/generated/api.ts",
]

[tasks."generate:api"]
description = "Regenerate API files"
depends = ["generate:api:go", "generate:api:web"]

[tasks."generate:homebrew"]
depends = ["validation:build:deps"]
description = "Generate Homebrew formula"
run = "pnpm --filter @tokeninsights/build-tools run generate:homebrew"

# Build

[tasks."build:web"]
depends = ["validation:build:deps"]
description = "Build and sync embedded web assets; skips unchanged inputs"
run = "node tools/build/src/build-web.ts"

[tasks."build:cli"]
description = "Build tokeninsights and tokeninsights-server into packages/cli/bin"
depends = ["build:web"]
dir = "{{config_root}}/packages/cli"
# Relative to dir. Includes embedded assets synced by build:web.
sources = ["**/*", "!bin/**", "../../mise.lock"]
outputs = ["bin/tokeninsights", "bin/tokeninsights-server"]
run = [
  "go build -o bin/tokeninsights ./cmd/tokeninsights",
  "go build -o bin/tokeninsights-server ./cmd/tokeninsights-server",
]

[tasks."build:plugins"]
depends = ["validation:build:deps"]
description = "Build plugin artifacts"
sources = [
  "packages/plugin-opencode/src/**/*",
  "packages/plugin-pi/src/**/*",
  "packages/plugin-runtime/src/**/*",
  "packages/plugin-opencode/package.json",
  "packages/plugin-pi/package.json",
  "pnpm-lock.yaml",
  "tools/build/src/build-plugins.ts",
]
outputs = ["packages/plugin-opencode/dist/**/*", "packages/plugin-pi/dist/**/*"]
run = "pnpm --recursive --filter '@tokeninsights/plugin-*' run build"

[tasks.build]
description = "Build production binaries and plugins, validating contracts"
run = [
  { tasks = [
    "validation:build:check-schema",
    "validation:build:check-api",
  ] },
  { tasks = [
    "build:cli",
    "build:plugins",
  ] },
]

[tasks."build:docs"]
depends = ["validation:build:deps"]
description = "Build public documentation as static files"
run = "pnpm --filter @tokeninsights/docs run build"

[tasks."install:cli"]
description = "Install tokeninsights binaries into Go's bin directory"
depends = ["build:web"]
dir = "{{config_root}}/packages/cli"
run = "go install ./cmd/tokeninsights ./cmd/tokeninsights-server"

# Test

[tasks."test:js"]
description = "Isolated javascript validation"
dir = "{{config_root}}/tools/validation"
run = "go run ./cmd/validate --group javascript"

[tasks."test:go"]
description = "Isolated go validation"
dir = "{{config_root}}/tools/validation"
run = "go run ./cmd/validate --group go"

[tasks."test"]
description = "Isolated javascript, go validation"
dir = "{{config_root}}/tools/validation"
run = "go run ./cmd/validate --group javascript --group go"

[tasks."test:race"]
description = "Isolated go validation"
dir = "{{config_root}}/tools/validation"
run = "go run ./cmd/validate --group go"

[tasks."bench:smoke"]
description = "Isolated benchmarks validation"
dir = "{{config_root}}/tools/validation"
run = "go run ./cmd/validate --group benchmarks"

[tasks."bench:storage"]
description = "Run storage benchmarks"
depends = ["build:web"]
dir = "{{config_root}}/packages/cli"
run = "node ../../tools/build/src/test-go.ts -run ^$ -bench ^BenchmarkStorage$ -benchtime=3x -count=3 -p=1 -timeout=30m"

[tasks."test:distribution"]
description = "Isolated distribution validation"
dir = "{{config_root}}/tools/validation"
run = "go run ./cmd/validate --group distribution"

[tasks."test:web-e2e"]
description = "Isolated browser validation"
dir = "{{config_root}}/tools/validation"
run = "go run ./cmd/validate --group browser"

[tasks."test:container"]
description = "Isolated deployment validation"
dir = "{{config_root}}/tools/validation"
run = "go run ./cmd/validate --group deployment"

[tasks."check:push"]
description = "Full local verification before push"
run = "node tools/build/src/check-push.ts"

[tasks."check:push:stages"]
description = "Internal verification stages, entered through the repository gate"
hide = true
run = [
  "test \"$TOKENINSIGHTS_CHECK_GATE_ACTIVE\" = 1",
  # Keep the mandatory repository gate until committed aggregate parity is verified.
  "node tools/build/src/check-stages.ts validate",
]

# Develop

[tasks.dev]
description = "Run Go API and hot-reloading web app"
depends = ["dev:data"]
output = "prefix"
run = "node tools/build/src/dev.ts"

[tasks."dev:data"]
description = "Recreate sanitized fixture data"
depends = ["build:cli"]
run = "pnpm --filter @tokeninsights/build-tools run setup-dev-data"

[tasks."dev:cli"]
description = "Open TUI with fixture data"
depends = ["dev:data"]
interactive = true
run = "TOKENINSIGHTS_ACCESS_TOKEN= ./packages/cli/bin/tokeninsights tui --sync=false --all-time --collector-db-path .tokeninsights-dev/collector.sqlite --server-db-path .tokeninsights-dev/server.sqlite --app-db-path .tokeninsights-dev/app.sqlite"

[tasks."dev:server"]
description = "Run Go API with fixture data"
depends = ["dev:data"]
output = "prefix"
run = "node tools/build/src/dev-server.ts"

[tasks."dev:web"]
depends = ["validation:build:deps"]
description = "Run hot-reloading web app against Go API"
output = "prefix"
run = "pnpm --filter @tokeninsights/web run dev"

[tasks."dev:web:mock"]
depends = ["validation:build:deps"]
description = "Run web app with synthetic API responses"
output = "prefix"
run = "pnpm --filter @tokeninsights/web run dev:mock"

[tasks."dev:docs"]
depends = ["validation:build:deps"]
description = "Serve public documentation with live reload"
output = "prefix"
run = "pnpm --filter @tokeninsights/docs run dev"

[tasks."start:web"]
description = "Build frontend into Go and run local Web capture/dashboard"
depends = ["build:cli"]
output = "prefix"
run = "./packages/cli/bin/tokeninsights web"

[tasks."validation:internal:contracts"]
hide = true
run = [
  "node tools/build/src/format-go.ts --check",
  "oxfmt --check {{vars.format_paths}}",
  "mise fmt --check",
  "node tools/build/src/check-schema.ts",
  "node tools/build/src/check-api.ts",
  "node tools/build/src/check-toolchain.ts",
  "cd tools/validation && go test -count=1 contract.go main_test.go",
  "cd tools/validation && go test -count=1 ./cmd/validate",
]

[tasks."validation:internal:javascript"]
hide = true
run = [
  "oxlint {{vars.lint_paths}}",
  "pnpm --workspace-concurrency=2 --recursive --filter '@tokeninsights/plugin-*' run typecheck",
  "pnpm --workspace-concurrency=2 --recursive --filter '@tokeninsights/plugin-*' run check:build",
  "pnpm --filter @tokeninsights/build-tools run typecheck",
  "pnpm --filter @tokeninsights/build-tools run test",
  "pnpm --filter @tokeninsights/web run test",
]

[tasks."validation:internal:go"]
hide = true
run = [
  "cd packages/cli && go tool -modfile=golangci-lint.mod golangci-lint run ./...",
  "cd packages/cli && node ../../tools/build/src/test-go.ts -race",
]

[tasks."validation:internal:benchmarks"]
hide = true
run = [
  "cd packages/cli && node ../../tools/build/src/test-go.ts --benchmark-smoke",
]

[tasks."validation:internal:distribution"]
hide = true
run = ["node tools/build/src/test-distribution.ts"]

[tasks."validation:internal:browser"]
hide = true
run = ["pnpm --filter @tokeninsights/web run test:e2e"]

[tasks."validation:internal:deployment"]
hide = true
run = [
  "cd packages/cli && go test ./internal/deployment -run ^TestContainerDeployment$ -count=1 -timeout=5m",
]

[tasks."validate"]
dir = "{{config_root}}/tools/validation"
run = "go run ./cmd/validate"

[tasks."validate:status"]
dir = "{{config_root}}/tools/validation"
run = "go run ./cmd/validate --status"

[tasks."pr:create"]
dir = "{{config_root}}/tools/validation"
run = "go run ./cmd/validate --pr-create"

[tasks."pr:update"]
dir = "{{config_root}}/tools/validation"
run = "go run ./cmd/validate --pr-update"

[tasks."validation:build:deps"]
hide = true
run = "mise deps install"

[tasks."validation:build:check-schema"]
hide = true
depends = ["validation:build:deps"]
run = "pnpm --filter @tokeninsights/build-tools run check:schema"

[tasks."validation:build:check-api"]
hide = true
depends = ["validation:build:deps"]
run = "pnpm --filter @tokeninsights/build-tools run check:api"
