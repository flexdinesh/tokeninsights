# Host TLS proxy forwards to this loopback-published port. Trust only its
# observed peer CIDR; see docs/deployment.md for forwarded-header handling.
services:
  tokeninsights:
    build:
      context: ..
    image: tokeninsights-server:local
    environment:
      TOKENINSIGHTS_STORAGE_BACKEND: sqlite
      TOKENINSIGHTS_LISTEN: 0.0.0.0:8766
      TOKENINSIGHTS_PUBLIC_URL: '${TOKENINSIGHTS_PUBLIC_URL:?Set the canonical HTTPS dashboard URL}'
      TOKENINSIGHTS_ADMIN_SOCKET: /run/tokeninsights/admin.sock
      TOKENINSIGHTS_TRUSTED_PROXIES: '${TOKENINSIGHTS_TRUSTED_PROXIES:-}'
      TOKENINSIGHTS_SERVER_DB_PATH: /data/server.sqlite
      TOKENINSIGHTS_APP_DB_PATH: /data/app.sqlite
    ports:
      - '127.0.0.1:8766:8766'
    read_only: true
    tmpfs:
      - /run/tokeninsights:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=0700
    volumes:
      - hosted-data:/data
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  hosted-data:
