# Publish on loopback; ingress/TLS is deployment-owned.
services:
  tokeninsights:
    build:
      context: ..
    image: tokeninsights-server:local
    environment:
      TOKENINSIGHTS_STORAGE_BACKEND: postgres
      TOKENINSIGHTS_LISTEN: '0.0.0.0:${TOKENINSIGHTS_SERVER_PORT:-8766}'
      TOKENINSIGHTS_PUBLIC_URL: '${TOKENINSIGHTS_PUBLIC_URL:-}'
      TOKENINSIGHTS_SIGNUP_ENABLED: '${TOKENINSIGHTS_SIGNUP_ENABLED:-false}'
      TOKENINSIGHTS_BOOTSTRAP_USERNAME: '${TOKENINSIGHTS_BOOTSTRAP_USERNAME:-}'
      TOKENINSIGHTS_BOOTSTRAP_PASSWORD: '${TOKENINSIGHTS_BOOTSTRAP_PASSWORD:-}'
      TOKENINSIGHTS_ADMIN_SOCKET: /run/tokeninsights/admin.sock
      TOKENINSIGHTS_TRUSTED_PROXIES: '${TOKENINSIGHTS_TRUSTED_PROXIES:-}'
      TOKENINSIGHTS_POSTGRES_DSN_FILE: /run/secrets/postgres_dsn
    ports:
      - '127.0.0.1:${TOKENINSIGHTS_SERVER_PORT:-8766}:${TOKENINSIGHTS_SERVER_PORT:-8766}'
    read_only: true
    tmpfs:
      - /run/tokeninsights:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=0700
    secrets:
      - postgres_dsn
    stop_grace_period: 30s
    restart: unless-stopped

secrets:
  postgres_dsn:
    file: '${TOKENINSIGHTS_POSTGRES_DSN_FILE:?Set path to a DSN file readable by UID 10001}'
