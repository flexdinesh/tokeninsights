# A TLS reverse proxy forwards to 127.0.0.1:8765. Supply an existing PostgreSQL 18
# database through the environment; no password or DSN appears in argv.
services:
  tokeninsights:
    build:
      context: ..
    image: tokeninsights-server:local
    environment:
      TOKENINSIGHTS_STORAGE_BACKEND: postgres
      TOKENINSIGHTS_POSTGRES_DSN: '${TOKENINSIGHTS_POSTGRES_DSN:?Set the PostgreSQL DSN}'
    command:
      - --listen
      - '0.0.0.0:8765'
      - --public-url
      - '${TOKENINSIGHTS_PUBLIC_URL:?Set the canonical HTTPS dashboard URL}'
      - --admin-socket
      - /run/tokeninsights/admin.sock
    ports:
      - '127.0.0.1:8765:8765'
    stop_grace_period: 30s
    restart: unless-stopped
