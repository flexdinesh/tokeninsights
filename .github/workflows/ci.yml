name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  HUSKY: '0'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Native OS/architecture coverage cannot be reproduced by one developer host.
  native:
    name: Native ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install_args: go node pnpm
      - run: mise run setup
      - run: pnpm run build:web
      - name: Build and verify storage
        working-directory: packages/cli
        env:
          CGO_ENABLED: '0'
        run: |
          go build ./cmd/tokeninsights ./cmd/tokeninsights-server
          go test ./internal/datastore ./internal/rawcollectorstore

  edge:
    name: Publish edge source
    needs: native
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          install_args: node pnpm
      - run: mise run setup
      - run: pnpm run build:web
      # Publication is CI-owned. Its Git/install contracts run locally in check:push.
      - name: Publish tested source with assets
        run: node tools/build/src/install-refs.ts edge
