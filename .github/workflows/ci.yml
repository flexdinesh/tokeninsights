name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up project tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run setup

      - name: Minimal checks
        run: mise run check:ci

  native:
    name: Native ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install_args: go
      - name: Build and verify storage
        working-directory: packages/cli
        env:
          CGO_ENABLED: '1'
        run: |
          go build ./cmd/tokeninsights ./cmd/tokeninsights-server
          go test ./internal/datastore ./internal/rawcollectorstore
