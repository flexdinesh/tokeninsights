name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up project tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run setup

      - name: Minimal checks
        run: mise run check:ci

  publish-dev:
    name: Publish dev
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up publication tools
        uses: jdx/mise-action@v4
        with:
          install_args: node

      - name: Publish main to dev
        run: node tools/build/src/publish-dev.ts
