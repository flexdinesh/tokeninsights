name: CI

# Native archives require macOS and native runners; main omits macOS Intel. Local Dagger owns full validation.
on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  HUSKY: '0'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        env:
          SOURCE: ${{ github.sha }}
        run: echo "value=main.${SOURCE:0:12}" >> "$GITHUB_OUTPUT"
  products:
    needs: source
    uses: ./.github/workflows/products.yml
    with:
      source: ${{ github.sha }}
      version: ${{ needs.source.outputs.version }}
      platforms: >-
        [
        {"runner":"ubuntu-24.04","os":"linux","arch":"amd64"},
        {"runner":"ubuntu-24.04-arm","os":"linux","arch":"arm64"},
        {"runner":"macos-15","os":"darwin","arch":"arm64"}
        ]
  publish:
    needs: [source, products]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install_args: node
      - uses: actions/download-artifact@v8
        with:
          pattern: products-*
          path: dist
          merge-multiple: true
      - name: Publish verified main build
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_VERSION: ${{ needs.source.outputs.version }}
        run: |
          node --input-type=module -e 'import { writeChecksums } from "./tools/build/src/build-products.ts"; await writeChecksums("dist")'
          node tools/build/src/publish-release.ts main "$PRODUCT_VERSION" dist
