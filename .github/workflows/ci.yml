name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up project tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run setup

      - name: Minimal checks
        run: mise run check:ci

  postgres:
    name: PostgreSQL contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: mise run setup
      - name: Live storage, hosted and deployment contracts
        working-directory: packages/cli
        run: node ../../tools/build/src/test-go.ts -run "TestToken|TestAccount|TestOwnership|TestSchemaAndPair|TestWriteRollback|TestHosted|TestFutureProcessor|TestTimestampCredentials|TestConfigurationErrors|TestRemoteFailureRetains|TestRemoteCommitted|TestAllHarnesses|TestConcurrentCopied|TestConfigRemoteSync"

      - name: Execute benchmark fixtures on both backends
        run: pnpm run bench:smoke

  container:
    name: Server container contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: mise run setup
      - run: pnpm run test:container

  native:
    name: Native ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install_args: go
      - name: Build and verify storage
        working-directory: packages/cli
        env:
          CGO_ENABLED: '0'
        run: |
          go build ./cmd/tokeninsights ./cmd/tokeninsights-server
          go test ./internal/datastore ./internal/rawcollectorstore
