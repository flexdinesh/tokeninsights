name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable stable version (x.y.z)
        required: true
        type: string

permissions:
  contents: write

env:
  HUSKY: '0'

concurrency:
  group: release-tokeninsights
  cancel-in-progress: false

jobs:
  source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install_args: node
      - name: Create immutable source tag
        id: source
        env:
          PRODUCT_VERSION: ${{ inputs.version }}
        run: |
          node tools/build/src/publish-release.ts tag "$PRODUCT_VERSION"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  products:
    needs: source
    uses: ./.github/workflows/products.yml
    with:
      source: ${{ needs.source.outputs.commit }}
      version: ${{ inputs.version }}
      platforms: >-
        [
        {"runner":"ubuntu-24.04","os":"linux","arch":"amd64"},
        {"runner":"ubuntu-24.04-arm","os":"linux","arch":"arm64"},
        {"runner":"macos-15-intel","os":"darwin","arch":"amd64"},
        {"runner":"macos-15","os":"darwin","arch":"arm64"}
        ]
  publish:
    needs: [source, products]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install_args: node
      - uses: actions/download-artifact@v8
        with:
          pattern: products-*
          path: dist
          merge-multiple: true
      - name: Publish complete stable release
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e 'import { writeChecksums } from "./tools/build/src/build-products.ts"; await writeChecksums("dist")'
          node tools/build/src/publish-release.ts stable "$PRODUCT_VERSION" dist
