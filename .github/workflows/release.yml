name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  HUSKY: '0'

concurrency:
  group: release-tokeninsights
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      create: ${{ steps.tag.outputs.create }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Pin source
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up project tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run setup

      - name: Minimal checks
        run: mise run check:ci

      - name: Select release version
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          tag_prefix="packages/cli/v"
          tag="$(cd packages/cli && go run ./tools/release-version)"
          if tag_commit="$(git rev-list -n 1 "${tag}" 2>/dev/null)"; then
            head_commit="$(git rev-parse HEAD)"
            if [[ "${tag_commit}" != "${head_commit}" ]]; then
              echo "${tag} points to ${tag_commit}, not current main ${head_commit}" >&2
              exit 1
            fi
            create="false"
          else
            create="true"
          fi

          version="${tag#${tag_prefix}}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "create=${create}" >> "$GITHUB_OUTPUT"

  native:
    name: Native ${{ matrix.os }}/${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: jdx/mise-action@v4
      - name: Build and smoke test native binaries
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          commit="$(git rev-parse --short HEAD)"
          date="$(git show -s --format=%cI HEAD)"
          module="github.com/flexdinesh/tokeninsights/packages/cli/internal/version"
          archive_dir="tokeninsights_${version}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p "dist/${archive_dir}"
          (
            cd packages/cli
            for binary in tokeninsights tokeninsights-server; do
              go build -trimpath \
                -ldflags="-s -w -X ${module}.Version=${version} -X ${module}.Commit=${commit} -X ${module}.Date=${date}" \
                -o "../../dist/${archive_dir}/${binary}" "./cmd/${binary}"
            done
            go test ./internal/datastore ./internal/rawcollectorstore
          )
          PATH=/usr/bin:/bin "dist/${archive_dir}/tokeninsights" version
          PATH=/usr/bin:/bin "dist/${archive_dir}/tokeninsights-server" --version
          cp README.md LICENSE "dist/${archive_dir}/"
          tar -C dist -czf "dist/${archive_dir}.tar.gz" "${archive_dir}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz

  release:
    name: Publish release
    needs: [prepare, native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: mise run setup
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && shasum -a 256 *.tar.gz > checksums.txt
      - name: Create release tag
        if: needs.prepare.outputs.create == 'true'
        run: |
          git tag "${{ needs.prepare.outputs.tag }}"
          git push origin "${{ needs.prepare.outputs.tag }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ needs.prepare.outputs.tag }}"
          version="${{ needs.prepare.outputs.version }}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/*.tar.gz dist/checksums.txt --clobber
            gh release edit "${tag}" --draft=false --prerelease=false --latest
          else
            gh release create "${tag}" \
              dist/*.tar.gz \
              dist/checksums.txt \
              --title "tokeninsights v${version}" \
              --verify-tag \
              --latest \
              --generate-notes
          fi

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: flexdinesh/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          fetch-depth: 0

      - name: Generate Homebrew formula
        run: |
          pnpm run generate:homebrew -- \
            --version "${{ needs.prepare.outputs.version }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --checksums "${{ github.workspace }}/dist/checksums.txt" \
            --output "${{ github.workspace }}/homebrew-tap/Formula/tokeninsights.rb"

      - name: Validate Homebrew formula syntax
        run: ruby -c homebrew-tap/Formula/tokeninsights.rb

      - name: Open Homebrew tap pull request
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.prepare.outputs.version }}"
          tag="${{ needs.prepare.outputs.tag }}"
          encoded_tag="${tag//\//%2F}"
          branch="tokeninsights-v${version}"
          tap_repo="flexdinesh/homebrew-tap"

          cd homebrew-tap

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"

          if [[ -z "$(git status --porcelain -- Formula/tokeninsights.rb)" ]]; then
            echo "Homebrew formula is already up to date for tokeninsights v${version}."
            exit 0
          fi

          git add Formula/tokeninsights.rb
          git commit -m "Update tokeninsights to v${version}"
          git push --force-with-lease origin "HEAD:${branch}"

          pr_number="$(gh pr list \
            --repo "${tap_repo}" \
            --head "${branch}" \
            --state open \
            --json number \
            --jq '.[0].number // ""')"

          pr_body="$(mktemp)"
          cat > "${pr_body}" <<EOF
          Updates the tokeninsights formula to v${version}.

          Source release: https://github.com/flexdinesh/tokeninsights/releases/tag/${encoded_tag}

          This PR was generated by the TokenInsights release workflow.
          EOF

          if [[ -n "${pr_number}" ]]; then
            gh pr edit "${pr_number}" \
              --repo "${tap_repo}" \
              --title "Update tokeninsights to v${version}" \
              --body-file "${pr_body}"
          else
            gh pr create \
              --repo "${tap_repo}" \
              --head "${branch}" \
              --base main \
              --title "Update tokeninsights to v${version}" \
              --body-file "${pr_body}"
          fi
